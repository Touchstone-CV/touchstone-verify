[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "touchstone-verify"
version = "0.5.0"
description = "Touchstone SDK — verify a disclosure (zero deps) and mint one (the [record] extra)."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "Apache-2.0" }
authors = [{ name = "Touchstone" }]
keywords = ["touchstone", "audit-log", "verifier", "ed25519", "tamper-evident", "provenance"]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Security :: Cryptography",
]

[project.optional-dependencies]
# Verification is dependency-free; minting (touchstone_verify.record) needs an Ed25519 SIGNER, which the
# vendored verify-only curve code can't provide. `pip install "touchstone-verify[record]"` to mint.
record = ["pynacl>=1.5"]

[project.urls]
Homepage = "https://touchstone.cv"
Source = "https://github.com/Touchstone-CV/touchstone-verify"

[project.scripts]
touchstone-verify = "touchstone_verify.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
